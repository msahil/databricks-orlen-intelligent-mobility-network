bundle:
  name: orlen-mobility-ops

variables:
  catalog:
    description: Required Unity Catalog catalog supplied at deployment time
  schema:
    description: Required Unity Catalog schema supplied at deployment time
  workspace_root_path:
    description: Required personal Workspace parent folder supplied at deployment time
  project_name:
    description: Required customer project folder name supplied at deployment time
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.

resources:
  apps:
    app:
      name: 'orlen-mobility-ops'
      description: 'ORLEN Mobility operational decision workflow demo'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie
      config:
        env:
          - name: ORLEN_CATALOG
            value: ${var.catalog}
          - name: ORLEN_SCHEMA
            value: ${var.schema}
          - name: ORLEN_PROJECT_NAME
            value: ${var.project_name}

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      root_path: ${var.workspace_root_path}/${var.project_name}

    variables:
      # Environment-specific values are supplied with --var at deployment time.
