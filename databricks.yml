bundle:
  name: ws_orlen_intelligent_mobility

include:
  - resources/*.yml

variables:
  catalog:
    description: Required existing Unity Catalog catalog supplied at deployment time
  schema:
    description: Required ORLEN workshop schema supplied at deployment time
  workspace_root_path:
    description: Required personal Workspace parent folder supplied at deployment time
  project_name:
    description: Required customer project folder name created beneath workspace_root_path
  warehouse_id:
    description: SQL warehouse used by workshop assets
  participant_group:
    description: Workspace group allowed to view the demo assets
  data_event_count:
    description: Number of deterministic Mobility source events to generate
  mlflow_experiment_path:
    description: Workspace path for the Mobility MLflow experiment supplied at deployment time

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: ${var.workspace_root_path}/${var.project_name}
  workshop:
    mode: production
    workspace:
      root_path: ${var.workspace_root_path}/${var.project_name}
